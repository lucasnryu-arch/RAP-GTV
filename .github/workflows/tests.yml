name: tests

on:
  push:
  pull_request:

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Import and scientific checks
        run: pytest -q
      - name: Minimal synthetic example
        run: python examples/minimal_example.py
