[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapgtv"
version = "0.9.0"
description = "Reliability-Aware Physical Graph Total Variation for landslide deformation zoning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Shuo Lu"},
  {name = "Hui He"},
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
data = ["geopandas>=0.14", "pyproj>=3.5", "rasterio>=1.3"]
optical = ["xarray>=2024.1,<2025.2", "h5py>=3.10", "h5netcdf>=1.3"]
baselines = ["tsfresh==0.21.1"]
cuda = ["torch>=2.0"]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["rapgtv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
